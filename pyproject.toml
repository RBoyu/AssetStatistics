[project]
name = "asset-statistics"
version = "4.3.0"
description = "本地中文资产账本：银行存款与投资持仓管理"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
assetbook = "assetbook.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.0"

[tool.uv.build-backend]
module-name = "assetbook"
source-include = [
    "tests/**", "docs/USER_GUIDE.md", "AssetStatistics.py",
    "StartAssetBook.cmd", "uv.lock", ".python-version", ".gitignore",
]
source-exclude = ["tests/.tmp/**"]
